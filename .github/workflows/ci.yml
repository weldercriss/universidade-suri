# ==============================================================
# Universidade Suri — CI Pipeline
# ==============================================================
# Executa lint, typecheck, testes e build em cada push/PR.
# Backend roda com PostgreSQL de teste em serviço separado.
# ==============================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================
  # Backend
  # ===========================
  backend:
    name: Backend (Lint + Typecheck + Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unisuri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true  # Não bloquear enquanto codebase está sendo ajustado

      - name: Type check
        run: npm run typecheck
        continue-on-error: true  # strict mode pode ter warnings iniciais

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unisuri_test?schema=public

      - name: Run tests
        run: npm run test --if-present
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unisuri_test?schema=public
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars
          NODE_ENV: test

      - name: Build
        run: npm run build

  # ===========================
  # Frontend
  # ===========================
  frontend:
    name: Frontend (Lint + Typecheck + Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true  # strict mode pode ter warnings iniciais

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.universidadesuri.com.br

  # ===========================
  # Docker Build Validation
  # ===========================
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t unisuri-backend:test ./backend

      - name: Build frontend Docker image
        run: docker build -t unisuri-frontend:test ./frontend
