# ==============================================================
# Universidade Suri — Docker Compose (Produção)
# ==============================================================
# Para rodar em produção:
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# ANTES DE RODAR:
# 1. Crie um arquivo .env na raiz com as variáveis de produção
# 2. Obtenha o certificado SSL (veja docs/deploy-guide.md)
# 3. Atualize o domínio em nginx/nginx.conf
# ==============================================================

version: '3.8'

services:
  # ---------- Banco de Dados ----------
  db:
    image: postgres:16-alpine
    container_name: unisuri-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-unisuri_db}
    ports:
      - '5432:5432'
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unisuri-network

  # ---------- Backend (API NestJS) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unisuri-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME:-unisuri_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unisuri-network

  # ---------- Frontend (React/Vite + Nginx) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unisuri-frontend-prod
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - unisuri-network

  # ---------- Nginx Proxy Reverso (Opcional — com SSL) ----------
  # Descomente este bloco se quiser usar SSL com Let's Encrypt.
  # Neste caso, mude a porta do frontend para não usar 80 diretamente.
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: unisuri-nginx-prod
  #   restart: always
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - unisuri-network

volumes:
  pgdata_prod:
    driver: local

networks:
  unisuri-network:
    driver: bridge
